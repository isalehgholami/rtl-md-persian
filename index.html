<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="ویرایشگر سریع و ساده‌ی مارک‌داون راست‌به‌چپ با پیش‌نمایش زنده">
	<meta name="keywords" content="RTL,Markdown,farsi,arabic,hebrew,مارک‌داون">
	<meta name="author" content="iSalehGholami">
	<title>ویرایشگر مارک‌داون راست‌به‌چپ</title>

	<link rel="icon" href="logo.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
	<link rel="stylesheet" href="app/css/style.css">
	<script>
		try {
			var t = localStorage.getItem('theme') ||
				(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', t);
		} catch (e) {}
	</script>
</head>
<body>

	<header class="topbar">
		<div class="brand">
			<img class="logo" src="logo.svg" alt="" width="38" height="38">
			<div class="brand-text">
				<h1>ویرایشگر مارک‌داون</h1>
				<p>راست‌به‌چپ، سریع و ساده</p>
			</div>
		</div>

		<div class="actions">
			<button id="btn-dir" class="btn" type="button" title="تغییر جهت متن">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a4 4 0 0 0 0 8v8M13 4v16M9 4h8M17 4v16" /></svg>
				<span id="dir-label">RTL</span>
			</button>
			<button id="btn-copy" class="btn" type="button" title="کپی خروجی HTML">
				<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
				<span class="hide-sm">کپی HTML</span>
			</button>
			<button id="btn-theme" class="btn icon-only" type="button" title="تغییر پوسته" aria-label="تغییر پوسته">
				<svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
				<svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
			<button id="btn-render" class="btn primary" type="button" title="نمایش تمام‌صفحه‌ی مارک‌داون">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
				<span>رندر</span>
			</button>
		</div>
	</header>

	<main class="workspace">
		<section class="pane pane-editor" aria-label="ویرایشگر">
			<div class="pane-head"><span>نوشتار</span><span id="count" class="muted"></span></div>
			<textarea id="source" spellcheck="false" placeholder="مارک‌داون خود را اینجا بنویسید…"></textarea>
		</section>

		<section class="pane pane-preview" aria-label="پیش‌نمایش">
			<div class="pane-head"><span>پیش‌نمایش زنده</span></div>
			<article id="output" class="markdown-body"></article>
		</section>
	</main>

	<!-- Full-screen render -->
	<div id="reader" class="reader" hidden>
		<div class="reader-bar">
			<button id="reader-close" class="btn" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
				<span>بستن</span>
			</button>
			<button id="reader-fs" class="btn" type="button">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
				<span class="hide-sm">تمام‌صفحه‌ی مرورگر</span>
			</button>
		</div>
		<div class="reader-scroll">
			<article id="reader-output" class="markdown-body"></article>
		</div>
	</div>

	<footer class="footer">
		توسعه: <a href="https://github.com/iSalehGholami" dir="ltr">@iSalehGholami</a> · <a href="https://github.com/isalehgholami/rtl-md-persian">اگه به دردت خورد، یه ⭐ بده</a>
	</footer>

	<script src="assets/marked/marked.min.js"></script>
	<script src="app/js/rtlmd.js"></script>
</body>
</html>
